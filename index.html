<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deyse Nascimento — Analista de BPO · Ouvidoria</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4fbfa;--card:#fff;--ink:#12303a;--mute:#5a7480;--acc:#1f8fa0;--acc2:#f4a97a;--line:#d8e9e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1c21;--card:#152a31;--ink:#e6f2f2;--mute:#9bb5bb;--acc:#5cc6d6;--line:#25404a}}
:root[data-theme="dark"]{--bg:#0e1c21;--card:#152a31;--ink:#e6f2f2;--mute:#9bb5bb;--acc:#5cc6d6;--line:#25404a}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.6}
h1,h2,h3{font-family:Poppins,system-ui,sans-serif;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
nav{display:flex;gap:18px;justify-content:flex-end;padding:18px 0;font-size:14px;flex-wrap:wrap}
nav a{color:var(--mute);text-decoration:none}
.hero{padding:40px 0 56px;background:radial-gradient(600px 300px at 85% 20%,color-mix(in srgb,var(--acc2) 35%,transparent),transparent),radial-gradient(500px 300px at 10% 0,color-mix(in srgb,var(--acc) 25%,transparent),transparent)}
.tag{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 14px;font-size:13px;color:var(--acc);font-weight:500}
.hero h1{font-size:clamp(34px,7vw,56px);line-height:1.1;margin:16px 0 8px}
.hero p{max-width:600px;color:var(--mute);font-size:18px}
.btns{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{padding:12px 22px;border-radius:12px;text-decoration:none;font-weight:600;font-size:15px;background:var(--acc);color:#fff;border:0;cursor:pointer;font-family:inherit}
.btn.o{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
section{padding:44px 0}
h2{font-size:26px;margin-bottom:22px}
h2:after{content:"";display:block;width:44px;height:4px;border-radius:4px;background:var(--acc2);margin-top:8px}
.stats,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.stat b{font-family:Poppins,sans-serif;font-size:28px;color:var(--acc);display:block}
.stat span{font-size:13px;color:var(--mute)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:22px}
.job{position:relative;margin-bottom:18px}
.job:before{content:"";position:absolute;left:-30px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--acc);border:3px solid var(--bg)}
.co{color:var(--acc);font-weight:600;font-size:14px}.dt{font-size:13px;color:var(--mute);margin:2px 0 8px}
.job h3{font-size:18px}
.job ul{margin:0;padding-left:18px;color:var(--mute);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span.c{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:14px;font-weight:500}
footer{padding:40px 0 100px;text-align:center;color:var(--mute);font-size:13px}
.ed [contenteditable]{outline:1.5px dashed var(--acc);outline-offset:2px;border-radius:4px;min-height:1em}
.x{background:#d64545;color:#fff;border:0;border-radius:8px;padding:2px 9px;font-size:12px;cursor:pointer;margin:4px 4px 0 0}
#bar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:none;gap:8px;z-index:9;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#msg{font-size:13px;color:var(--mute);align-self:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="bar"></div>
<script id="data" type="application/json">{"name":"Deyse Nascimento","role":"Analista de BPO · Ouvidoria","hero":"Atendimento, ouvidoria e análise de demandas: mediando conflitos, organizando processos e melhorando a experiência do cliente.","about":["Profissional com experiência em Atendimento ao Cliente, Ouvidoria, BPO e Administração Financeira. Atuo com órgãos reguladores, mediação de conflitos, análise de demandas e suporte a equipes internas. Tenho perfil proativo, analítico e organizado, com facilidade de comunicação e resolução de problemas.","Meu objetivo é atuar em Atendimento, Ouvidoria, BPO ou áreas administrativas, contribuindo com análise de demandas, melhoria de processos e experiência do cliente."],"stats":[{"b":"2019","s":"na Paschoalotto, de operadora a analista"},{"b":"2022","s":"Analista de BPO – Ouvidoria"},{"b":"2026","s":"Tecnólogo em Design Gráfico e Digital"}],"jobs":[{"t":"Analista de BPO – Ouvidoria","co":"Paschoalotto Serviços de Call Center · Bauru, SP","dt":"04/2022 – atual","b":["Gestão e resposta de demandas junto a órgãos reguladores","Acompanhamento e análise de processos internos","Treinamento e suporte à equipe","Monitoramento de indicadores e qualidade de atendimento","Melhoria contínua dos fluxos de atendimento"]},{"t":"Assistente de Atendimento e Ouvidoria","co":"Paschoalotto Serviços de Call Center · Bauru, SP","dt":"12/2021 – 03/2022","b":["Atendimento e análise de reclamações","Mediação de conflitos entre cliente e empresa","Registro, classificação e acompanhamento de demandas"]},{"t":"Operadora de Telesserviços","co":"Paschoalotto Serviços de Call Center · Bauru, SP","dt":"09/2019 – 11/2021","b":["Atendimento ativo e receptivo ao cliente","Negociação e cobrança; prospecção e vendas","Foco em metas e qualidade no atendimento"]},{"t":"Assistente Administrativo e Financeiro","co":"ACZ Consultoria do Agronegócio · Avaré, SP","dt":"02/2019 – 05/2019","b":["Controle de contas a pagar e a receber","Elaboração de orçamentos e acompanhamento de custos","Suporte ao fluxo de caixa e organização de documentos","Atendimento ao cliente e suporte administrativo"]},{"t":"Estagiária","co":"ACZ Consultoria do Agronegócio · Avaré, SP","dt":"10/2018 – 02/2019","b":["Apoio nas rotinas administrativas e financeiras","Lançamento e análise de dados; elaboração de relatórios"]},{"t":"Estagiária","co":"Associação Comercial, Industrial e Agropecuária de Avaré","dt":"03/2018 – 10/2018","b":["Atendimento ao cliente e consultas ao SCPC, com análise de crédito","Cadastro de associados e organização de documentos e relatórios"]}],"skills":["Mediação de conflitos","Análise de processos","Gestão de demandas","Comunicação clara e assertiva","Monitoramento de indicadores","Salesforce","Pacote Office","Aprendizado de novas tecnologias"],"edu":[{"t":"Tecnólogo em Design Gráfico e Digital","co":"Centro Universitário FAM","dt":"2025 – 12/2026"},{"t":"Ensino Médio","co":"E.E. Dr. Paulo Araújo Novaes","dt":"2015 – 12/2017"}],"loc":"Agudos, SP · disponível para atuar presencialmente em Bauru, SP.","email":"mdeyse.nascimento@gmail.com","linkedin":"https://www.linkedin.com/in/deyse-nascimento-a7021b15a","whats":"https://wa.me/5514991075529"}</script>
<script>
const TPL="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
let S=JSON.parse(document.getElementById("data").textContent),edit=false,art=null;
const $=s=>document.querySelector(s),E=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ce=(p,t,tag="span",cls="")=>`<${tag} ${cls?`class="${cls}" `:""}data-p="${p}"${edit?' contenteditable="true"':""}>${E(t)}</${tag}>`;
const rm=(k,i)=>edit?`<button class="x" data-rm="${k}.${i}">remover</button>`:"";
const add=(k,l)=>edit?`<button class="btn o" data-add="${k}" style="margin-top:8px">+ ${l}</button>`:"";
function render(){
document.body.classList.toggle("ed",edit);
$("#app").innerHTML=`<header class="hero"><div class="wrap"><nav><a href="#sobre">Sobre</a><a href="#experiencia">Experiência</a><a href="#competencias">Competências</a><a href="#formacao">Formação</a><a href="#contato">Contato</a></nav>
${ce("role",S.role,"span","tag")}<h1>${ce("name",S.name,"span")}</h1>${ce("hero",S.hero,"p")}
<div class="btns"><a class="btn" href="#contato">Vamos conversar</a><a class="btn o" href="#experiencia">Ver trajetória</a></div></div></header>
<main class="wrap"><section id="sobre"><h2>Sobre mim</h2>${S.about.map((t,i)=>ce("about."+i,t,"p")+rm("about",i)).join("")}${add("about","parágrafo")}
<div class="stats">${S.stats.map((s,i)=>`<div class="stat">${ce(`stats.${i}.b`,s.b,"b")}${ce(`stats.${i}.s`,s.s)}${rm("stats",i)}</div>`).join("")}</div>${add("stats","destaque")}</section>
<section id="experiencia"><h2>Experiência</h2><div class="tl">${S.jobs.map((j,i)=>`<div class="job card">${ce(`jobs.${i}.t`,j.t,"h3")}<div>${ce(`jobs.${i}.co`,j.co,"span","co")}</div><div>${ce(`jobs.${i}.dt`,j.dt,"span","dt")}</div><ul data-l="jobs.${i}.b">${j.b.map(b=>`<li${edit?' contenteditable="true"':""}>${E(b)}</li>`).join("")}</ul>${edit?`<button class="x" data-addb="${i}" style="background:var(--acc)">+ tópico</button>`:""}${rm("jobs",i)}</div>`).join("")}</div>${add("jobs","experiência")}</section>
<section id="competencias"><h2>Competências</h2><div class="chips">${S.skills.map((s,i)=>`<span class="c">${ce("skills."+i,s)}${rm("skills",i)}</span>`).join("")}</div>${add("skills","competência")}</section>
<section id="formacao"><h2>Formação</h2><div class="grid">${S.edu.map((e,i)=>`<div class="card">${ce(`edu.${i}.t`,e.t,"h3")}<div>${ce(`edu.${i}.co`,e.co,"span","co")}</div><div>${ce(`edu.${i}.dt`,e.dt,"span","dt")}</div>${rm("edu",i)}</div>`).join("")}</div>${add("edu","formação")}</section>
<section id="contato"><h2>Contato</h2>${ce("loc",S.loc,"p")}
<div class="btns"><a class="btn" href="mailto:${E(S.email)}">E-mail</a><a class="btn o" href="${E(S.linkedin)}" target="_blank" rel="noopener">LinkedIn</a><a class="btn o" href="${E(S.whats)}" target="_blank" rel="noopener">WhatsApp</a></div>
${edit?`<p style="font-size:13px;color:var(--mute)">E-mail: ${ce("email",S.email)}<br>LinkedIn: ${ce("linkedin",S.linkedin)}<br>WhatsApp: ${ce("whats",S.whats)}</p>`:""}</section></main><footer>© 2026 Maria Deyse Leandro do Nascimento</footer>`;
bar();}
function setp(p,v){const k=p.split(".");let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
function collect(){document.querySelectorAll("[data-p]").forEach(e=>setp(e.dataset.p,e.innerText.trim()));
document.querySelectorAll("[data-l]").forEach(u=>setp(u.dataset.l,[...u.children].map(l=>l.innerText.trim()).filter(Boolean)));
S.skills=S.skills.filter(Boolean)}
function bar(){const b=$("#bar");if(!art){b.style.display="none";return}b.style.display="flex";
b.innerHTML=edit?`<span id="msg"></span><button class="btn o" id="cx">Cancelar</button><button class="btn" id="sv">Salvar</button>`:`<button class="btn" id="ed">Editar página</button>`;
if(edit){$("#cx").onclick=()=>{S=JSON.parse(document.getElementById("data").textContent);edit=false;render()};$("#sv").onclick=save}else $("#ed").onclick=()=>{edit=true;render()}}
async function save(){collect();$("#msg").textContent="Salvando…";
const json=JSON.stringify(S).replace(/</g,"\\u003c");
const html=TPL.replace(/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,c)=>a+json+c);
try{await art.publish(html)}catch(e){$("#msg").textContent=e&&e.code==="conflict"?"Página alterada em outro lugar; recarregando…":"Não foi possível salvar."}}
document.addEventListener("click",e=>{const t=e.target;if(!edit)return;
if(t.dataset.rm){collect();const[k,i]=t.dataset.rm.split(".");S[k].splice(+i,1);render()}
else if(t.dataset.add){collect();const k=t.dataset.add;S[k].push({about:"Novo parágrafo",stats:{b:"0",s:"Descrição"},jobs:{t:"Cargo",co:"Empresa · Cidade",dt:"MM/AAAA – MM/AAAA",b:["Atividade"]},skills:"Nova competência",edu:{t:"Curso",co:"Instituição",dt:"Período"}}[k]);render()}
else if(t.dataset.addb!==undefined){collect();S.jobs[+t.dataset.addb].b.push("Nova atividade");render()}});
render();
(async()=>{try{const u=await claude.use("user");if(!(u&&u.isOwner()))return;art=await claude.use("artifact");bar()}catch(e){}})();
</script>
</body>
</html>
